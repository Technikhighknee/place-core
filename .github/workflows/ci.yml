name: CI

on:
  push:
    branches:
      - CI
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run example:mini-city
      - run: npm run bench:guardrails
        env:
          GUARDRAIL_FAST: "1"
      - run: npm run bench:nearest-target
        env:
          NEAREST_TARGET_PLACES: "5000"
      - run: npm run bench:explicit-travel
        env:
          EXPLICIT_TRAVEL_PLACES: "5000"
          EXPLICIT_TRAVEL_QUERIES: "100"
      - run: npm run bench:portal-spatial
        env:
          PORTAL_SPATIAL_PLACES: "5000"
          PORTAL_SPATIAL_QUERIES: "1000"

  luebeck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run bench:luebeck
        env:
          LUEBECK_TRAVELERS: "250"
          LUEBECK_QUERY_COUNT: "50000"
          LUEBECK_MAX_TICKS: "1200"
          # Hosted GitHub runners have substantial throughput variance.
          # Keep CI thresholds broad; benchmark defaults stay stricter for dedicated runs.
          LUEBECK_MIN_PLANNING_PER_SECOND: "1000"
          LUEBECK_MIN_REPLANS_PER_SECOND: "1400"
