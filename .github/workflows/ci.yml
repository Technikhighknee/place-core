name: Road sync completeness verification

on:
  push:
    branches: [ci/baseline-verification]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --test test/late-bridge-attach.test.js
      - run: npm test
